<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cubo Mágico 3D</title>

  <!--============================================================
       CSS
       Estilos gerais: Bento
       Estilos do painel (#painel): Lorenna
  ================================================================ -->
  <style>

    /* ---------- (Bento) ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; }
    canvas { display: block; }

    /* ---------- (Lorenna) ---------- */
    #painel {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 8px;
      text-align: center;
    }

  </style>
</head>
<body>

  <!-- ================================================================
       PAINEL DE CONTROLES (HTML)
       (Lorenna)
       (O seletor de tema de Bento entra aqui dentro, na div indicada)
       ================================================================ -->
  <div id="painel">
    <!-- [Lorenna] botões das faces, embaralhar, reiniciar, contador, mensagens -->

    <!-- [Bento] seletor de tema -->
  </div>

  <!-- Biblioteca Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- [Bento] tag <script> do OrbitControls -->

  <script>

    // ================================================================
    // DIVISÃO:
    //   SEÇÃO 1 – Cena, câmera, renderer e loop ......... Bento
    //   SEÇÃO 2 – Cubo, cores e temas ................... Bento
    //   SEÇÃO 3 – Rotação das faces e animação .......... João
    //   SEÇÃO 4 – Controles, jogo e vitória ............. Lorenna
    //
    // Hierarquia base:
    //   globalGroup  ← escala/rotação aqui afeta o cubo inteiro
    //     └── cubinhos (27)
    //   Durante um giro, os cubinhos da face entram num grupo temporário.
    // ================================================================


    // ################################################################
    // SEÇÃO 1 – CENA, CÂMERA, RENDERER E LOOP        (Bento)
    // ################################################################

    // --- PILAR 1: SCENE ---
    const scene = new THREE.Scene(); // contêiner de todos os objetos do mundo 3D

    // --- PILAR 2: CAMERA ---
    const camera = new THREE.PerspectiveCamera(
      45,                                     // campo de visão (FOV) em graus
      window.innerWidth / window.innerHeight, // aspecto = largura / altura da janela
      0.1,                                    // distância mínima de renderização (near)
      1000                                  // distância máxima de renderização (far)
    );
    camera.position.set(0, 1.5, 8); // posição inicial, enquadra o cubo 3x3x3
    camera.lookAt(0, 0, 0);
    
    // --- PILAR 3: RENDERER ---
    const renderer = new THREE.WebGLRenderer({ antialias: true }); // renderizador WebGL com suavização de bordas
    renderer.setSize(window.innerWidth, window.innerHeight);        // canvas ocupa toda a janela
    renderer.setClearColor(0x111111);                               // fundo cinza escuro
    document.body.appendChild(renderer.domElement);                 // insere o canvas gerado na página

    // --- GRUPO GLOBAL (raiz do cubo) ---
    const globalGroup = new THREE.Group(); // grupo pai de tudo que pertence ao cubo
    scene.add(globalGroup);                // adiciona à cena para que apareça na renderização

    // --- REDIMENSIONAMENTO DA JANELA ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;  // corrige aspecto da câmera
      camera.updateProjectionMatrix();                         // aplica o novo aspecto
      renderer.setSize(window.innerWidth, window.innerHeight); // redimensiona o canvas
    });

    // --- LOOP DE ANIMAÇÃO ---
    // Chama as funções das outras seções a cada frame.
    // (atualizarAnimacao() é definida na SEÇÃO 3; mantenha o nome.)
    function animate() {
      requestAnimationFrame(animate); // agenda a próxima chamada — cria o loop de 60fps

      atualizarAnimacao();            // [João] avança a animação de rotação da face

      renderer.render(scene, camera); // desenha o frame atual
    }

    // ################################################################
    // SEÇÃO 2 – CUBO, CORES E TEMAS                  (Bento)
    // ################################################################

    // [Bento] Aqui entram:
    //  geometria compartilhada e os 27 cubinhos
    //  lista de cubinhos (usada pelas Seções 3 e 4)
    //  materiais/cores por face
    //  paletas de tema e função para aplicar tema
    
    const geoCubo = new THREE.BoxGeometry(1,1,1);
    const distancia = 1 + 0.1;
    const cubinhos = [];

    const cores = {
      direita:  0xff0000,
      esquerda: 0xff8800,
      cima:     0xffffff,
      baixo:    0xffff00,
      frente:   0x00aa00,
      tras:     0x0044ff
    };

    function listaMateriais(x, y, z){
      return [
        new THREE.MeshBasicMaterial({ color: x === 1 ? cores.direita : 0x000000 }),
        new THREE.MeshBasicMaterial({ color: x === -1 ? cores.esquerda : 0x000000 }),
        new THREE.MeshBasicMaterial({ color: y === 1 ? cores.cima : 0x000000 }),
        new THREE.MeshBasicMaterial({ color: y === -1 ? cores.baixo : 0x000000 }),
        new THREE.MeshBasicMaterial({ color: z === 1 ? cores.frente : 0x000000 }),
        new THREE.MeshBasicMaterial({ color: z === -1 ? cores.tras : 0x000000 }),
      ]
    }

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const cubo = new THREE.Mesh(
            geoCubo,
            listaMateriais(x,y,z)
          );
          cubo.position.x = x * distancia;
          cubo.position.y = y * distancia;
          cubo.position.z = z * distancia;
          cubinhos.push({mesh: cubo, x, y, z});
          globalGroup.add(cubo);
        }       
      }
    }

    // ################################################################
    // SEÇÃO 3 – ROTAÇÃO DAS FACES E ANIMAÇÃO         (João)
    // ################################################################

    // ----------------------------------------------------------------
    // 3.1  DEFINIÇÃO DAS 6 FACES
    // ----------------------------------------------------------------
    // Cada face é descrita por:
    //   nome   → texto amigável (útil para a interface)
    //   eixo   → em torno de qual eixo a face gira ('x', 'y' ou 'z')
    //   camada → qual fatia do cubo ela é nesse eixo:
    //            +1 = lado positivo do eixo, -1 = lado negativo
    // As letras seguem a notação oficial do cubo mágico:
    //   U = Up (superior), D = Down (inferior), F = Front (frontal),
    //   B = Back (traseira), L = Left (esquerda), R = Right (direita)
    const FACES = {
      U: { nome: 'Superior', eixo: 'y', camada:  1 },
      D: { nome: 'Inferior', eixo: 'y', camada: -1 },
      F: { nome: 'Frontal',  eixo: 'z', camada:  1 },
      B: { nome: 'Traseira', eixo: 'z', camada: -1 },
      R: { nome: 'Direita',  eixo: 'x', camada:  1 },
      L: { nome: 'Esquerda', eixo: 'x', camada: -1 }
    };

    // Devolve os 9 cubinhos que pertencem à face pedida.
    // Usa a posição LÓGICA (c.x, c.y, c.z), que vale -1, 0 ou 1.
    // Ex.: face 'U' → todos os cubinhos com c.y === 1.
    function pecasDaFace(letra) {
      const def = FACES[letra];                                 // pega a definição da face
      return cubinhos.filter(c => c[def.eixo] === def.camada);  // filtra pela camada
    }

    // ----------------------------------------------------------------
    // 3.2  CONSTANTES E ESTADO
    // ----------------------------------------------------------------
    const QUARTO_DE_VOLTA = Math.PI / 2; // 90° em radianos (um giro de face)

    // PROVISÓRIO: faces que já podem girar. Vai crescendo a cada commit
    // (commit 7 acrescenta D e L; commit 8 acrescenta B e R).
    const FACES_LIBERADAS = ['U', 'F'];

    let giroAtual = null; // dados do giro em andamento (null = nenhum)

    // ----------------------------------------------------------------
    // 3.3  GIRO INSTANTÂNEO (sem animação)
    // ----------------------------------------------------------------

    // Gira uma face NA HORA, no sentido horário visto de fora do cubo.
    // Ignorado se já houver um giro em andamento ou se a face ainda não foi liberada.
    function girarFaceInstantaneo(letra) {
      if (giroAtual !== null || !FACES_LIBERADAS.includes(letra)) return;
      iniciarGiro(letra);   // anexa os cubinhos ao grupo temporário
      finalizarGiro();      // aplica os 90° de uma vez e reancora
    }

    // Começa um giro: cria o grupo temporário e coloca nele os 9 cubinhos da face.
    function iniciarGiro(letra) {
      const def = FACES[letra];                    // definição da face (eixo e camada)

      const grupo = new THREE.Group();             // grupo temporário que vai girar
      globalGroup.add(grupo);                      // fica dentro do globalGroup (herda escala/rotação do cubo)

      const pecas = pecasDaFace(letra);            // os 9 cubinhos da camada
      pecas.forEach(c => grupo.attach(c.mesh));    // attach = troca o pai SEM mover o cubinho visualmente

      // Sentido horário visto de fora do cubo. No Three.js, ângulo positivo gira
      // no sentido anti-horário visto do lado POSITIVO do eixo. Logo, nas faces do
      // lado positivo (U, F, R) o horário é negativo; nas do lado negativo (D, B, L) é positivo.
      const anguloAlvo = -def.camada * QUARTO_DE_VOLTA;

      giroAtual = { face: letra, eixo: def.eixo, anguloAlvo: anguloAlvo, grupo: grupo, pecas: pecas };
    }

    // Termina o giro: crava o ângulo final, devolve os cubinhos ao globalGroup
    // (reancorar), limpa erros numéricos e atualiza as posições lógicas.
    function finalizarGiro() {
      const g = giroAtual;

      g.grupo.rotation[g.eixo] = g.anguloAlvo;     // aplica o ângulo exato (±90°) ao grupo
      g.grupo.updateMatrixWorld(true);             // garante que a matriz do grupo está atualizada

      g.pecas.forEach(c => {
        globalGroup.attach(c.mesh);                // devolve o cubinho ao globalGroup mantendo o visual
        arredondarPeca(c);                         // elimina erros de ponto flutuante
      });

      globalGroup.remove(g.grupo);                 // o grupo temporário não é mais necessário
      giroAtual = null;                            // libera para um novo giro
    }

    // Limpa a imprecisão numérica de um cubinho e atualiza sua posição lógica.
    function arredondarPeca(c) {
      const m = c.mesh;

      // Posição: força para o múltiplo exato de "distancia" mais próximo.
      m.position.set(
        Math.round(m.position.x / distancia) * distancia,
        Math.round(m.position.y / distancia) * distancia,
        Math.round(m.position.z / distancia) * distancia
      );

      // Rotação: força cada ângulo para o múltiplo de 90° mais próximo.
      const arredonda90 = (ang) => Math.round(ang / QUARTO_DE_VOLTA) * QUARTO_DE_VOLTA;
      m.rotation.set(
        arredonda90(m.rotation.x),
        arredonda90(m.rotation.y),
        arredonda90(m.rotation.z)
      );

      // Posição lógica (-1, 0 ou 1): decide a qual camada o cubinho pertence no
      // PRÓXIMO giro. Se não for atualizada, as faces seguintes ficam erradas.
      c.x = Math.round(m.position.x / distancia);
      c.y = Math.round(m.position.y / distancia);
      c.z = Math.round(m.position.z / distancia);
    }

    // ----------------------------------------------------------------
    // 3.4  TECLAS DE TESTE (TEMPORÁRIO)
    // ----------------------------------------------------------------
    // Só para testar a mecânica enquanto a Seção 4 não existe.
    // [Lorenna] quando você ligar os seus controles, troque para false
    // (ou apague este bloco) para os giros não serem disparados em dobro.
    const ATIVAR_TECLAS_DE_TESTE = true;

    if (ATIVAR_TECLAS_DE_TESTE) {
      document.addEventListener('keydown', (e) => {
        const letra = e.key.toUpperCase();                           // 'u' e 'U' viram 'U'
        if (letra.length === 1 && FACES_LIBERADAS.includes(letra)) { // é uma face já liberada?
          girarFaceInstantaneo(letra);
        }
      });
    }

    // Chamada a cada frame pelo loop da SEÇÃO 1.
    // Por enquanto vazia; será preenchida no commit 5 (animação suave).
    function atualizarAnimacao() {
      // [João] avançar a rotação em andamento
    }

    // ################################################################
    // SEÇÃO 4 – CONTROLES, JOGO E VITÓRIA            (Lorenna)
    // ################################################################

    // [Lorenna] Aqui entram:
    //  listeners de teclado e dos botões do painel
    //  contador de movimentos e cronômetro
    //  embaralhar, verificação de resolvido e detecção de vitória
    //  reiniciar cubo

    animate(); // dispara o loop pela primeira vez
  </script>
</body>
</html>
